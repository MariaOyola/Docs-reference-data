# Job de deriva del spec — pendiente de `SPEC_REPO_TOKEN`
#
# HU-SHELL-005 dejó esta deuda: el CI usa la copia versionada en `spec/`, así que no
# se entera si el spec cambia en `design-software-docs`. Alguien edita `spec/` a mano
# o regenera contra una fuente vieja, el CI pasa, y el design-system queda
# desincronizado del spec ratificado.
#
# Este job lo resuelve clonando las fuentes reales y fallando si `spec/` quedó
# desactualizado.
#
# ⚠️ QUÉ ES PRIVADO Y QUÉ NO (verificado 2026-10-13):
#   - `design-software-docs`  → PRIVADO. Necesita credencial.
#   - `design-software-pages` → PÚBLICO. `GITHUB_TOKEN` puede leerlo sin secreto.
#
# ⚠️ PENDIENTE DE DECISIÓN (ver DEUDA-spec-repo-access.md):
#   Un PAT fine-grained no se puede scoped a `code-sena` desde una cuenta que no es
#   miembro: GitHub solo lista en "Resource owner" las orgs con fine-grained PATs
#   habilitado. Las dos opciones viables son:
#     A) Deploy key SSH de solo lectura en `design-software-docs` (recomendado) →
#        secret `SPEC_REPO_SSH_KEY`.
#     B) PAT clásico con scope `repo` → secret `SPEC_REPO_TOKEN`.
#
# ⚠️ NO SE ACTIVA HASTA QUE HAYA CREDENCIAL. Sin ella, el checkout del repo privado
#    falla y este job rompe el pipeline. Está comentado a propósito.
#
# Ver "Deuda" en README.md para el paso a paso de creación del PAT.

